name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest 2>/dev/null || true

      - name: Syntax check all .py
        run: |
          find . -name "*.py" -not -path "./.git/*" -print0 | xargs -0 -n1 python -m py_compile

      - name: Run tests
        run: |
          if [ -f tests/test_all.py ]; then python tests/test_all.py; fi
          if [ -f tests/test_new_modules.py ]; then python tests/test_new_modules.py; fi
          if [ -f test_fallback_v2.py ]; then python test_fallback_v2.py; fi
          if [ -f test_phone_gitee.py ]; then python test_phone_gitee.py; fi
          if [ -f test_termux_input.py ]; then python test_termux_input.py; fi
