// 项目级 build.gradle —— Nexa Inference Service (APK)
// 该 APK 在手机本地启动一个 localhost HTTP 推理服务，
// 通过 Nexa Android SDK 调用端侧模型（LLM / VLM），
// 优先使用 Qualcomm Hexagon NPU（plugin_id="npu"），不可用时回退 CPU。
// ZeroTermux (marvis) 通过 http://127.0.0.1:8080 调用本服务。

plugins {
    id("com.android.application") version "8.2.2" apply false
    id("org.jetbrains.kotlin.android") version "1.9.22" apply false
}
